[tool.coverage.run]
branch = true
source = ["opentelemetry/instrumentation/dify"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.poetry]
name = "opentelemetry-instrumentation-dify"
version = "0.49.8"
description = "OpenTelemetry Dify instrumentation"
authors = [
  "Gal Kleinman <gal@traceloop.com>",
  "Nir Gazit <nir@traceloop.com>",
  "Tomer Friedman <tomer@traceloop.com>",
]
repository = "https://github.com/traceloop/openllmetry/tree/main/packages/opentelemetry-instrumentation-dify"
license = "Apache-2.0"
readme = "README.md"

[[tool.poetry.packages]]
include = "opentelemetry/instrumentation/dify"

[tool.poetry.dependencies]
python = ">=3.9,<4"
opentelemetry-api = "^1.38.0"
opentelemetry-instrumentation = ">=0.59b0"
opentelemetry-semantic-conventions = ">=0.59b0"
opentelemetry-semantic-conventions-ai = "^0.4.13"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.3.1"
flake8 = "7.1.1"
pytest = "^8.3.3"
pytest-sugar = "1.0.0"

[tool.poetry.group.test.dependencies]
dify-client = ">=0.1.10"
pytest = "^8.3.3"
pytest-sugar = "1.0.0"
vcrpy = "^6.0.2"
pytest-recording = "^0.13.2"
pytest-asyncio = "^0.24.0"
opentelemetry-sdk = "^1.38.0"
requests-mock = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
instruments = ["dify-client"]

[tool.poetry.plugins."opentelemetry_instrumentor"]
dify = "opentelemetry.instrumentation.dify:DifyInstrumentor"
